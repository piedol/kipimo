[workspace]
members = ["crates/app", "crates/sys", "crates/clean", "crates/space", "crates/startup", "crates/updates"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
kipimo-sys = { path = "crates/sys" }
kipimo-clean = { path = "crates/clean" }
kipimo-space = { path = "crates/space" }
kipimo-startup = { path = "crates/startup" }
kipimo-updates = { path = "crates/updates" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
libc = "0.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-security = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-service-management = "0.3.2"
objc2-user-notifications = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "socks-proxy"] }
plist = "1.10"
quick-xml = "0.42"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, not abort: a scan or parser bug in one tool must not take the whole menu-bar app down.
panic = "unwind"
strip = true
debug = false
